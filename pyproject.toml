[project]
name = "ai-fin-assistant"
version = "0.1.0"
description = "AI Investment Research Assistant with RAG, Agents, and Financial Sentiment Analysis"
authors = [
    {name = "Yahya Sultan Chaudhry", email = "yahyasultanch@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "openai>=1.54.5",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "transformers>=4.46.3",
    "torch>=2.5.1",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "yfinance>=0.2.49",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "feedparser>=6.0.11",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "markdown>=3.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.8.0"]
pdf = ["pdfkit>=1.0.0"]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
